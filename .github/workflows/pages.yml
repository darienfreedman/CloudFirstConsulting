name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages.outputs.build_type }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '"base_url=\(.html_url)\nbuild_type=\(.build_type)"' >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate site
        run: npm test
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build public assets only
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Validate deployed paths and assets
        run: |
          npm run validate:docs
          npm run validate:pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload site
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_build_type == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
